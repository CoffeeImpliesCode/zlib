# Verification for the Zig package in this repository.
#
# zlib's release ships no CI of its own that travels in the tarball: there is
# no `.github/` directory anywhere under `src/`. This file is therefore entirely
# the fork's, and it gates the artifacts this fork delivers rather than
# retargeting anything upstream owns.
#
# Four jobs, four different questions:
#   native    does the whole 15-unit closure compile and link in both linkages,
#             do the tests and the example run, and does the *installed* tree
#             serve a plain C consumer -- including a C program that checks its
#             answers against values another implementation recorded
#   cross     does the whole package compile for each of the six check targets,
#             wasm32-wasi included, without running any of them
#   cross-shared
#             the same six targets through -Dlinkage=dynamic
#   consumer  does the published module resolve from a package that did not
#             write it, in both linkages
#
# The two linkages share one `native` job rather than being two jobs. The C gate
# program below is written once into `$RUNNER_TEMP` and used against both
# deliveries, which is only possible in one job - and sharing it is what makes
# the comparison meaningful: the same program has to pass linked against
# `libz.a` and linked against `libz.so.1.3.2`, so a difference between the two
# artifacts cannot hide.
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate run has printed
# the failure. If a target ever does turn out to be unsupported here, the
# honest edit is to replace that step with a command that asserts the specific
# documented failure and to record the run in FORK-NOTES.md, not to add a flag
# that hides it.
#
# System-library mode (`-Dsystem=true`) is deliberately not a step here: it needs
# an installed libz with its own headers, and a stock runner has neither. It is
# gated locally on a machine that has it, and a claim about it needs that run,
# not this file.
#
# The full 53-platform matrix is not in this file. `cross-test`, run from the
# package root, builds and *runs* `tests.zig` for every platform in Zig 0.16.0's
# published Tier 1/2 table through this repository's own build graph, using
# `cross-test.profile.sh` for its settings. It is not a job here because
# `cross-test` and its sibling helpers are a host-local tool with its own runner
# detection and its own scratch policy, not something a GitHub runner has;
# adding a job that invoked a path it does not have would fail for a reason that
# has nothing to do with this package, and wrapping that job in an availability
# check would turn a missing gate into a green one. So this file does not
# pretend to cover it and does not stand in for it: the `cross` jobs below run
# nothing, and a platform with no runner on the host is recorded as explicit
# `build_only` coverage, never as a pass. The command and its receipts belong
# in README.md and FORK-NOTES.md.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests, example and installed closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The bytes, the exact upstream file set, the fixture digests, and zlib's
      # own notice in both of the files that carry it. The zlib licence obliges
      # an altered source to be plainly marked, so a dropped notice has to be
      # caught before anything ships.
      - name: immutable source, fixtures and licence notice
        run: |
          set -euo pipefail
          sha256sum -c UPSTREAM.sha256
          tools/check-provenance.sh

      # Written once, used by both linkages.
      #
      # Every reference value in this program is read out of a file another
      # program wrote -- `fixtures/pyzlib/checksums.txt`, which records what
      # zlib **1.2.13** computed, and `fixtures/PROVENANCE.md`'s digests -- and
      # none of them is computed here and compared against itself. The payload
      # is `fixtures/plain.bin` read from this checkout, the same 275 bytes every
      # other gate in this repository checksums. A program that asked zlib
      # whether it agreed with itself would prove nothing; this one asks zlib
      # 1.3.2 to reproduce numbers a different release of the reference
      # implementation recorded.
      - name: write the C gate program
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          #include <zlib.h>

          /* zlib 1.2.13, as recorded in fixtures/pyzlib/checksums.txt. */
          static const unsigned long want_adler = 3970324232UL;
          static const unsigned long want_crc   = 1368583364UL;

          static int failures;

          static void check(int ok, const char *what, long got, long want)
          {
              if (ok) {
                  printf("ok   %-46s %ld\n", what, got);
              } else {
                  printf("FAIL %-46s got %ld want %ld\n", what, got, want);
                  failures++;
              }
          }

          static unsigned char *slurp(const char *path, size_t *len)
          {
              FILE *f = fopen(path, "rb");
              unsigned char *buf;
              if (!f) { perror(path); exit(2); }
              buf = malloc(1 << 20);
              if (!buf) { fprintf(stderr, "out of memory\n"); exit(2); }
              *len = fread(buf, 1, 1 << 20, f);
              fclose(f);
              return buf;
          }

          int main(int argc, char **argv)
          {
              const char *payload_path = argc > 1 ? argv[1] : "fixtures/plain.bin";
              const char *gzip_path = argc > 2 ? argv[2] : "fixtures/gzip/gzip-n1.bin";
              unsigned char *payload, *gz, plain[4096];
              size_t payload_len, gz_len;

              /* The version the headers declare, not a constant this program
                 chose: a library that disagreed with its own header would be
                 caught here rather than by a consumer at run time. */
              check(strcmp(zlibVersion(), ZLIB_VERSION) == 0,
                    "zlibVersion() matches ZLIB_VERSION from zlib.h",
                    0, 0);
              check(((unsigned long)zlibCompileFlags() & (1UL << 8)) == 0,
                    "ZLIB_DEBUG is clear", 0, 0);
              check(((unsigned long)zlibCompileFlags() & (1UL << 10)) == 0,
                    "ZLIB_WINAPI is clear", 0, 0);

              payload = slurp(payload_path, &payload_len);
              check(payload_len == 275, "the shared payload is 275 bytes",
                    (long)payload_len, 275L);

              /* The two checksums another release of the reference
                 implementation recorded for exactly these bytes. */
              check(adler32(adler32(0L, Z_NULL, 0), payload,
                            (uInt)payload_len) == want_adler,
                    "adler32(payload) as zlib 1.2.13 recorded it",
                    (long)want_adler, (long)want_adler);
              check(crc32(crc32(0L, Z_NULL, 0), payload,
                          (uInt)payload_len) == want_crc,
                    "crc32(payload) as zlib 1.2.13 recorded it",
                    (long)want_crc, (long)want_crc);

              /* An independent encoder's RFC 1952 member, decoded by the
                 installed library's inflate with a gzip wrapper. GNU gzip 1.13
                 wrote fixtures/gzip/gzip-n1.bin and implements RFC 1951 itself
                 without linking libz, so this input cannot have come out of this
                 library and a decoder that only agreed with itself could not
                 pass it. */
              gz = slurp(gzip_path, &gz_len);
              {
                  z_stream st;
                  int rc;
                  memset(&st, 0, sizeof st);
                  /* 16 + MAX_WBITS selects the gzip wrapper, per
                     src/zlib.h:236-241. */
                  rc = inflateInit2(&st, 16 + MAX_WBITS);
                  check(rc == Z_OK, "inflateInit2 for a gzip stream", rc, Z_OK);
                  st.next_in = gz;
                  st.avail_in = (uInt)gz_len;
                  st.next_out = plain;
                  st.avail_out = (uInt)sizeof plain;
                  rc = inflate(&st, Z_FINISH);
                  check(rc == Z_STREAM_END, "inflate reaches Z_STREAM_END", rc, Z_STREAM_END);
                  check(st.total_out == payload_len,
                        "the gzip member decodes to the 275-byte payload",
                        (long)st.total_out, (long)payload_len);
                  check(memcmp(plain, payload, payload_len) == 0,
                        "the decoded bytes are the payload byte for byte", 0, 0);
                  /* RFC 1950 and RFC 1952 both carry the Adler-32 trailer;
                     zlib's inflate checks it, and a mismatch surfaces as
                     Z_DATA_ERROR rather than as a silent pass. */
                  inflateEnd(&st);
              }

              free(payload);
              free(gz);
              printf("%s: %d failure(s)\n", failures ? "FAILED" : "passed", failures);
              return failures ? 1 : 0;
          }
          C

      # ---------------------------------------------------------------- static
      - name: build (static, the default)
        run: zig build --summary all

      # The installed closure is the deliverable, so it is checked as a layout
      # and not merely as a successful exit code: the artifact names upstream's
      # own `src/Makefile.in:32-36` gives, both public headers including the
      # *generated* zconf.h, the pkg-config file, the man page upstream installs
      # under man/man3, and the licence material that travels with the binary.
      - name: static installed closure is complete
        run: |
          set -euo pipefail
          test -f zig-out/lib/libz.a
          test -f zig-out/include/zlib.h
          test -f zig-out/include/zconf.h
          test -f zig-out/lib/pkgconfig/zlib.pc
          test -f zig-out/share/man/man3/zlib.3
          test -f zig-out/share/licenses/zlib/LICENSE
          test -f zig-out/share/licenses/zlib/zlib.h
          test -f zig-out/share/licenses/zlib/NOTICE.md
          test -f zig-out/share/licenses/zlib/FORK-LICENSE.md
          test -f zig-out/share/licenses/zlib/UPSTREAM.md
          test -f zig-out/share/licenses/zlib/UPSTREAM.sha256
          # The generated zconf.h must be the one that was compiled, not the
          # POSIX copy upstream ships in src/. If the include order were ever
          # wrong this is the file that would differ.
          ! cmp -s zig-out/include/zconf.h src/zconf.h.in \
            || { echo "the installed zconf.h is still upstream's template"; exit 1; }
          echo "static installed closure is complete"

      # pkg-config has to answer from the installed tree alone, which is what
      # makes it worth asking: a C consumer reaches this package through these
      # flags and nothing else.
      - name: pkg-config answers for the static install
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          pkg-config --exists zlib
          test "$(pkg-config --modversion zlib)" = "1.3.2"
          test "$(pkg-config --variable=libdir zlib)" = "$PWD/zig-out/lib"
          echo "pkg-config: $(pkg-config --libs --cflags zlib)"

      - name: installed C headers compile, link and run against the archive
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          zig cc -std=gnu99 \
            $(pkg-config --cflags zlib) \
            "$RUNNER_TEMP/c_surface_gate.c" \
            -o "$RUNNER_TEMP/c_gate_static" \
            $(pkg-config --libs zlib)
          "$RUNNER_TEMP/c_gate_static" fixtures/plain.bin fixtures/gzip/gzip-n1.bin

      # The `gz*` file layer is half of zlib's API and a header-only check would
      # never reach it. This writes a member through the installed library and
      # reads it back through the installed library, and checks the header fields
      # RFC 1952 §2.3.1 gives them.
      - name: the installed gz file layer writes and reads a real member
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gz_gate.c" <<'C'
          #include <stdio.h>
          #include <string.h>
          #include <zlib.h>

          int main(int argc, char **argv)
          {
              gzFile f;
              char buf[1024];
              int n, failures = 0;
              unsigned char hdr[10];

              if (argc != 2) { fprintf(stderr, "usage: gz_gate <file>\n"); return 2; }

              f = gzopen(argv[1], "wb9");
              if (!f) { fprintf(stderr, "gzopen for write failed\n"); return 1; }
              if (gzwrite(f, "hello from the installed zlib\n", 28) != 28) {
                  fprintf(stderr, "gzwrite short\n"); return 1;
              }
              if (gzclose(f) != Z_OK) { fprintf(stderr, "gzclose failed\n"); return 1; }

              /* RFC 1952 §2.3.1: ID1 ID2 CM FLG MTIME[4] XFL OS. */
              {
                  FILE *raw = fopen(argv[1], "rb");
                  if (!raw || fread(hdr, 1, 10, raw) != 10) return 1;
                  fclose(raw);
              }
              if (hdr[0] != 0x1f || hdr[1] != 0x8b) { printf("FAIL gzip magic\n"); failures++; }
              if ((hdr[2] & 0x0f) != 8)          { printf("FAIL CM is not 8\n"); failures++; }
              if (hdr[9] != 3)                   { printf("FAIL OS is not 3\n"); failures++; }

              f = gzopen(argv[1], "rb");
              if (!f) { fprintf(stderr, "gzopen for read failed\n"); return 1; }
              n = gzread(f, buf, (unsigned)sizeof buf);
              if (n != 28) { printf("FAIL gzread returned %d\n", n); failures++; }
              if (memcmp(buf, "hello from the installed zlib\n", 28) != 0) {
                  printf("FAIL round trip content\n"); failures++;
              }
              if (gztell(f) != 28) { printf("FAIL gztell\n"); failures++; }
              gzclose(f);

              printf("%s: gz file layer\n", failures ? "FAILED" : "passed");
              return failures ? 1 : 0;
          }
          C
          zig cc -std=gnu99 -I zig-out/include \
            "$RUNNER_TEMP/gz_gate.c" -o "$RUNNER_TEMP/gz_gate" \
            -L zig-out/lib -lz
          "$RUNNER_TEMP/gz_gate" "$RUNNER_TEMP/gz_gate.gz"
          rm -f "$RUNNER_TEMP/gz_gate.gz"

      - name: test (static, Debug)
        run: zig build test

      - name: test (static, ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: smoke (static)
        run: zig build smoke

      # --------------------------------------------------------------- dynamic
      # Removed first so the shared delivery cannot be mistaken for the static
      # one still in zig-out/.
      - name: build (shared object)
        run: |
          set -euo pipefail
          rm -rf zig-out
          zig build -Dlinkage=dynamic --summary all

      # Upstream's own file names, from src/Makefile.in:34-35: the versioned
      # object and the soname link beside it.
      - name: shared install is a loadable object with upstream's ABI name
        run: |
          set -euo pipefail
          so=zig-out/lib/libz.so.1.3.2
          test -f "$so"
          test -L zig-out/lib/libz.so.1
          test "$(readlink zig-out/lib/libz.so.1)" = "libz.so.1.3.2"
          # An ELF shared object needs a soname or a consumer cannot record the
          # dependency it actually has.
          readelf -d "$so" | grep -q 'SONAME.*libz.so.1'
          echo "libz.so.1.3.2 with soname libz.so.1"

      - name: the dynamic symbol table is exactly the header-declared API
        run: |
          set -euo pipefail
          so=zig-out/lib/libz.so.1.3.2
          # The build applies the version script from src/zlib.map, so the
          # dynamic symbol table must be the interface that script names and not
          # every symbol the objects happen to define. An internal symbol leaking
          # out fails here.
          exported=$(nm -D --defined-only "$so" | awk '{print $3}' | LC_ALL=C sort)
          echo "$exported" | grep -qx 'compress2'
          echo "$exported" | grep -qx 'uncompress2'
          echo "$exported" | grep -qx 'adler32'
          echo "$exported" | grep -qx 'crc32'
          echo "$exported" | grep -qx 'deflate'
          echo "$exported" | grep -qx 'inflate'
          echo "$exported" | grep -qx 'gzopen'
          echo "$exported" | grep -qx 'gzread'
          echo "$exported" | grep -qx 'zlibVersion'
          # Internal zlib state must not be reachable: these are the symbols a
          # private prefix exists to keep private.
          if echo "$exported" | grep -qx 'deflate_state'; then
            echo "FAIL deflate_state is exported"; exit 1
          fi
          if echo "$exported" | grep -qx 'inflate_state'; then
            echo "FAIL inflate_state is exported"; exit 1
          fi
          echo "the dynamic symbol table is the declared interface"

      # Compared on identical ground: the same gate program, the same payload
      # and the same recorded answers as the static run above.
      - name: installed C headers load the shared object through pkg-config and run
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          test "$(pkg-config --modversion zlib)" = "1.3.2"
          zig cc -std=gnu99 \
            $(pkg-config --cflags zlib) \
            "$RUNNER_TEMP/c_surface_gate.c" \
            -o "$RUNNER_TEMP/c_gate_shared" \
            $(pkg-config --libs zlib)
          LD_LIBRARY_PATH="$PWD/zig-out/lib" \
            "$RUNNER_TEMP/c_gate_shared" fixtures/plain.bin fixtures/gzip/gzip-n1.bin

      - name: the gz file layer works through the shared object
        run: |
          set -euo pipefail
          zig cc -std=gnu99 -I zig-out/include \
            "$RUNNER_TEMP/gz_gate.c" -o "$RUNNER_TEMP/gz_gate_shared" \
            -L zig-out/lib -lz
          LD_LIBRARY_PATH="$PWD/zig-out/lib" \
            "$RUNNER_TEMP/gz_gate_shared" "$RUNNER_TEMP/gz_gate_shared.gz"
          rm -f "$RUNNER_TEMP/gz_gate_shared.gz"

      - name: test (shared object, Debug)
        run: zig build test -Dlinkage=dynamic

      - name: test (shared object, ReleaseSafe)
        run: zig build test -Dlinkage=dynamic -Doptimize=ReleaseSafe

      - name: smoke (shared object)
        run: zig build smoke -Dlinkage=dynamic

      # ------------------------------------------------------- runtime loading
      # `-Druntime` is a different configuration, not a different optimisation:
      # the facade module links no archive at all and a provider is named by an
      # explicit `load(source)`. The provider here is the shared object this same
      # tree just built, passed as an argument -- never discovered -- because a
      # build that was not told which file to load must say so instead of
      # loading something else.
      - name: runtime dispatch, tests against the shared object
        run: |
          set -euo pipefail
          zig build test -Druntime=true \
            -- --provider "$PWD/zig-out/lib/libz.so.1.3.2"

      - name: runtime dispatch, example against the shared object
        run: |
          set -euo pipefail
          zig build smoke -Druntime=true \
            -- --provider "$PWD/zig-out/lib/libz.so.1.3.2"

      # The other half of the contract: a runtime-loading build that was not
      # told which provider to use stops and says so, rather than falling back
      # to a linked copy or to some default path. A non-zero exit with the
      # variable's name in the output is the behaviour being asserted here.
      - name: an unnamed provider is refused, with the reason
        run: |
          set -uo pipefail
          unset ZLIB_TEST_PROVIDER
          if output=$(zig build smoke -Druntime=true 2>&1); then
            echo "FAIL: the smoke run succeeded with no provider named" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "$output" | grep -q 'ZLIB_TEST_PROVIDER'
          echo "the run refused and named ZLIB_TEST_PROVIDER"

  cross:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Nothing here runs. Each cell compiles the whole 15-unit closure, runs
      # upstream's own genzconf.c for that target, translates the headers and
      # links the facade, the tests and the example -- so a cell is a check of
      # the facade rather than of an unreferenced archive.
      - name: check x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all

      # `zconf.h` is generated per target, and this is the cell where the answer
      # differs from the POSIX one: `src/zconf.h:488-490` includes
      # `<unistd.h>` only to get a declaration, and `src/gzguts.h:46-49`
      # includes `<stddef.h>`. The generated header has to say so.
      - name: check x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all

      # The sixth row of the matrix, and unlike a shared object on a target with
      # no dynamic linker, nothing refuses it. `build.zig` lists wasm32-wasi in
      # `check_targets` precisely because a static WASI cell is expected to
      # compile; the step is here so that if it ever stops compiling, that is a
      # failure here rather than a surprise in the ledger.
      - name: check wasm32-wasi
        run: zig build check -Dtarget=wasm32-wasi --summary all

  cross-shared:
    name: cross-target compile matrix, shared artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: check x86_64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dlinkage=dynamic -Dtarget=aarch64-macos-none --summary all

      - name: check x86_64-windows-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=riscv64-linux-gnu --summary all

      # wasm32-wasi is a passing row here too, and it is *not* dropped. The
      # shared object on a target whose OS has no dynamic linker is refused by
      # `deliveredLinkage`, so this step asserts that specific documented
      # refusal rather than a vague failure -- which pins *which* refusal it is,
      # and pins it as one that fires before any delivery decision.
      - name: wasm32-wasi is refused a shared object before delivery is chosen
        run: |
          set -uo pipefail
          if output=$(zig build check -Dlinkage=dynamic -Dtarget=wasm32-wasi 2>&1); then
            echo "FAIL: a shared object on wasm32-wasi was accepted" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "$output" | grep -qi 'dynamic\|shared'
          echo "the shared object is refused on wasm32-wasi, for the documented reason"

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The dependent package in consumer/, reached through a relative path in
      # its own manifest rather than a fetch, so what this proves is that the
      # published module resolves from a package that did not write it.
      #
      # It is also the second place the interoperation claim is made: main.zig
      # re-checks the two checksums zlib 1.2.13 recorded and decodes a frame GNU
      # gzip 1.13 wrote, from outside this package.
      - name: run
        working-directory: consumer
        run: zig build run

      - name: run against the shared object
        working-directory: consumer
        run: zig build run -Dlinkage=dynamic